name: Atualizar resultados e publicar

on:
  schedule:
    # A cada 20 minutos (UTC). O GitHub pode atrasar execuções agendadas.
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/results.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Coletar dados do g1
        id: scrape
        continue-on-error: true
        run: python3 scripts/scrape.py

      - name: Avisar se a coleta falhou
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Falha ao coletar os dados do g1; publicando a última versão válida."

      - name: Salvar dados coletados
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Outra execução pode ter publicado enquanto esta rodava: recoloca o
          # HEAD no topo do remoto e tenta de novo antes de desistir.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --soft origin/main
            if ! python3 scripts/data_changed.py; then
              echo "Sem mudanças relevantes nos dados (apenas horário de coleta)."
              exit 0
            fi
            git add data/results.json
            git commit --quiet -m "chore: resultados atualizados em $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push --quiet origin HEAD:main; then
              echo "Dados publicados no repositório."
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt); repetindo."
            sleep 3
          done
          echo "::error::Não foi possível publicar data/results.json após 3 tentativas."
          exit 1

      - name: Preparar site
        run: |
          mkdir -p dist
          cp -r index.html assets data dist/

      - name: Upload do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
