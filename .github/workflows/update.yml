name: Atualizar resultados e publicar

on:
  schedule:
    # A cada 20 minutos (UTC). O GitHub pode atrasar execuções agendadas.
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/results.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar dados do g1
        id: scrape
        continue-on-error: true
        run: python3 scripts/scrape.py

      - name: Avisar se a coleta falhou
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Falha ao coletar os dados do g1; publicando a última versão válida."

      - name: Salvar dados coletados
        run: |
          if git diff --quiet -- data/results.json; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "chore: resultados atualizados em $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Preparar site
        run: |
          mkdir -p dist
          cp -r index.html assets data dist/

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
